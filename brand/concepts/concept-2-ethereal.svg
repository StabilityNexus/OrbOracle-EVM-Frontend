<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Multi-stage Bloom & Glow -->
    <filter id="c2-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="c2-softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Deep Ambient Atmosphere -->
    <radialGradient id="c2-ambientGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Main Ethereal Orb Volumetric Core -->
    <radialGradient id="c2-orbCore" cx="42%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="15%" stop-color="#A5F3FC" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="65%" stop-color="#0284C7" />
      <stop offset="88%" stop-color="#0C2356" />
      <stop offset="100%" stop-color="#030A1C" />
    </radialGradient>

    <!-- Swirling Ethereal Ring Gradients -->
    <linearGradient id="c2-ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FF" />
      <stop offset="40%" stop-color="#00F0FF" />
      <stop offset="80%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0A192F" />
    </linearGradient>

    <linearGradient id="c2-ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80F8FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#003366" stop-opacity="0.1" />
    </linearGradient>

    <!-- Focal Specular Flare -->
    <radialGradient id="c2-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#80F8FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Radiant Halo -->
  <circle cx="128" cy="128" r="118" fill="url(#c2-ambientGrad)" />

  <!-- Outer Pulsing Ripple Wave (Decentralized Signal) -->
  <circle cx="128" cy="128" r="108" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.25" stroke-dasharray="4 8" />
  <circle cx="128" cy="128" r="98" fill="none" stroke="url(#c2-ringGrad1)" stroke-width="2" opacity="0.6" filter="url(#c2-softGlow)" />

  <!-- Primary Solid Sphere Body -->
  <circle cx="128" cy="128" r="88" fill="url(#c2-orbCore)" />

  <!-- Dynamic Swirling Fluid Arcs (Ethereal Shader Lines) -->
  <path d="M 52 128 C 52 82, 90 48, 140 48 C 190 48, 208 88, 204 128 C 200 168, 166 208, 116 208 C 76 208, 52 168, 52 128 Z" 
        fill="none" stroke="url(#c2-ringGrad1)" stroke-width="3" opacity="0.75" />

  <path d="M 68 108 C 80 68, 130 58, 172 76 C 204 90, 214 134, 188 168 C 162 202, 110 200, 84 172 C 64 150, 60 128, 68 108 Z" 
        fill="none" stroke="url(#c2-ringGrad2)" stroke-width="2.5" transform="rotate(-30 128 128)" opacity="0.6" />

  <!-- Core Radiant Resonance Cavity -->
  <circle cx="128" cy="128" r="46" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.5" filter="url(#c2-softGlow)" />
  <circle cx="128" cy="128" r="32" fill="url(#c2-flare)" filter="url(#c2-glow)" />

  <!-- Incandescent Nucleus -->
  <circle cx="128" cy="128" r="10" fill="#FFFFFF" />

  <!-- Dual Orbiting Data Feed Nodes -->
  <!-- Upper Right Feed Node -->
  <circle cx="192" cy="74" r="6" fill="#FFFFFF" filter="url(#c2-softGlow)" />
  <circle cx="192" cy="74" r="10" fill="none" stroke="#80F8FF" stroke-width="1.5" opacity="0.8" />

  <!-- Lower Left Feed Node -->
  <circle cx="64" cy="182" r="5" fill="#38BDF8" filter="url(#c2-softGlow)" />
  <circle cx="64" cy="182" r="8" fill="none" stroke="#0284C7" stroke-width="1.2" opacity="0.7" />
</svg>
