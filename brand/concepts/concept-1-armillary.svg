<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow -->
    <filter id="c1-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Deep Spherical Volumetric Gradient -->
    <radialGradient id="c1-sphereGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#E0F7FF" />
      <stop offset="18%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="82%" stop-color="#0B2A63" />
      <stop offset="100%" stop-color="#020B1E" />
    </radialGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="c1-rimGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#80F8FF" />
      <stop offset="45%" stop-color="#00F0FF" />
      <stop offset="80%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#003380" />
    </linearGradient>

    <!-- Orbital Latitude/Longitude Gradient -->
    <linearGradient id="c1-orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#80F8FF" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#00A8FF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Core Focal Light -->
    <radialGradient id="c1-coreLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#80F8FF" />
      <stop offset="75%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Corona Ring -->
  <circle cx="128" cy="128" r="106" fill="none" stroke="url(#c1-rimGrad)" stroke-width="2" opacity="0.4" stroke-dasharray="6 6" />
  
  <!-- Outer Halo Atmosphere -->
  <circle cx="128" cy="128" r="98" fill="none" stroke="url(#c1-rimGrad)" stroke-width="4" filter="url(#c1-glow)" opacity="0.85" />

  <!-- Base Shaded Sphere Body -->
  <circle cx="128" cy="128" r="94" fill="url(#c1-sphereGrad)" />

  <!-- Inner Dimension Shadow Ring -->
  <circle cx="128" cy="128" r="94" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.4" />

  <!-- Armillary Geodesic Latitudes & Longitudes -->
  <g fill="none" stroke="url(#c1-orbitGrad)">
    <!-- Primary Equator Ring (tilted 25 deg) -->
    <ellipse cx="128" cy="128" rx="94" ry="40" stroke-width="3" transform="rotate(-25 128 128)" />
    <!-- Secondary Tropic Ring (tilted -25 deg) -->
    <ellipse cx="128" cy="128" rx="94" ry="40" stroke-width="2.5" transform="rotate(35 128 128)" stroke-dasharray="180 8 40 8" />
    <!-- Polar Meridian Orbit -->
    <ellipse cx="128" cy="128" rx="38" ry="94" stroke-width="2.5" transform="rotate(-15 128 128)" />
    <!-- Outer Equatorial Horizon Ring (transverse) -->
    <ellipse cx="128" cy="128" rx="94" ry="18" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Oracle Consensus Horizon Axis Line -->
  <line x1="42" y1="168" x2="214" y2="88" stroke="#80F8FF" stroke-width="1.5" opacity="0.4" stroke-dasharray="3 3" />

  <!-- Radiant Oracle Core Focal Beacon -->
  <circle cx="128" cy="128" r="32" fill="url(#c1-coreLight)" filter="url(#c1-glow)" />
  <circle cx="128" cy="128" r="8" fill="#FFFFFF" />
  <circle cx="128" cy="128" r="14" fill="none" stroke="#80F8FF" stroke-width="2" />

  <!-- Satellite Feed Nodes (Decentralized Network Oracles) -->
  <!-- Top Node -->
  <circle cx="198" cy="95" r="5" fill="#FFFFFF" filter="url(#c1-glow)" />
  <circle cx="198" cy="95" r="8" fill="none" stroke="#00F0FF" stroke-width="1.5" />
  <!-- Left Node -->
  <circle cx="58" cy="160" r="4.5" fill="#80F8FF" />
  <!-- Top-Center Orbit Junction -->
  <circle cx="112" cy="35" r="3.5" fill="#FFFFFF" />
  <!-- Bottom Right Orbit Junction -->
  <circle cx="168" cy="214" r="3.5" fill="#38BDF8" opacity="0.8" />
</svg>
