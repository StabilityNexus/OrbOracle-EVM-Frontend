<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Soft Luminous Glow -->
    <filter id="c3-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Segment Gradients for Isometric Depth -->
    <linearGradient id="c3-gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="c3-gradRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F2858" />
    </linearGradient>

    <linearGradient id="c3-gradBottom" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#030A1C" />
      <stop offset="50%" stop-color="#0B2B67" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <linearGradient id="c3-gradLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8FF" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#80F8FF" />
    </linearGradient>

    <!-- Center Pulse Light -->
    <radialGradient id="c3-coreBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#80F8FF" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Outer Subtle Ring -->
  <circle cx="128" cy="128" r="102" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.3" stroke-dasharray="3 6" />

  <!-- Geometric Interlocking Curved Shells -->
  <!-- Upper Shell -->
  <path d="M 128 32 A 96 96 0 0 1 224 128 C 224 96, 186 64, 128 64 C 70 64, 32 96, 32 128 A 96 96 0 0 1 128 32 Z" 
        fill="url(#c3-gradTop)" />

  <!-- Lower Shaded Base Shell -->
  <path d="M 128 224 A 96 96 0 0 1 32 128 C 32 160, 70 192, 128 192 C 186 192, 224 160, 224 128 A 96 96 0 0 1 128 224 Z" 
        fill="url(#c3-gradBottom)" />

  <!-- Dynamic Diagonal Ascending Loop (Left to Right Ribbon) -->
  <path d="M 40 144 C 48 88, 100 48, 164 56 C 196 60, 220 84, 222 116 C 224 148, 192 186, 140 198 C 96 208, 54 186, 40 144 Z" 
        fill="none" stroke="url(#c3-gradLeft)" stroke-width="12" stroke-linecap="round" filter="url(#c3-glow)" opacity="0.85" />

  <!-- Inner Recessed Sphere Core -->
  <circle cx="128" cy="128" r="44" fill="#051330" stroke="#00F0FF" stroke-width="2" />
  
  <!-- Glowing Center Oracle Nucleus -->
  <circle cx="128" cy="128" r="28" fill="url(#c3-coreBloom)" filter="url(#c3-glow)" />
  <circle cx="128" cy="128" r="7" fill="#FFFFFF" />

  <!-- Oracle Coordinate Precision Crosshairs -->
  <line x1="128" y1="76" x2="128" y2="92" stroke="#80F8FF" stroke-width="2" stroke-linecap="round" />
  <line x1="128" y1="164" x2="128" y2="180" stroke="#80F8FF" stroke-width="2" stroke-linecap="round" />
  <line x1="76" y1="128" x2="92" y2="128" stroke="#80F8FF" stroke-width="2" stroke-linecap="round" />
  <line x1="164" y1="128" x2="180" y2="128" stroke="#80F8FF" stroke-width="2" stroke-linecap="round" />
</svg>
