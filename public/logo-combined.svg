<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow -->
    <filter id="c-orb-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Deep Spherical Volumetric Gradient -->
    <radialGradient id="c-orb-sphere" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#E0F7FF" />
      <stop offset="18%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="82%" stop-color="#0B2A63" />
      <stop offset="100%" stop-color="#020B1E" />
    </radialGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="c-orb-rim" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#80F8FF" />
      <stop offset="45%" stop-color="#00F0FF" />
      <stop offset="80%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#003380" />
    </linearGradient>

    <!-- Orbital Latitude/Longitude Gradient -->
    <linearGradient id="c-orb-orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#80F8FF" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#00A8FF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Core Focal Light -->
    <radialGradient id="c-orb-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#80F8FF" />
      <stop offset="75%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <!-- Typography Gradients -->
    <linearGradient id="c-text-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#80F8FF" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00A8FF" />
    </linearGradient>
  </defs>

  <!-- Container Backdrop for universal viewing -->
  <rect width="760" height="200" rx="24" fill="#050A15" stroke="#1E293B" stroke-width="2"/>

  <!-- Left Emblem (cx=100, cy=100, scale 0.72) -->
  <g transform="translate(100, 100) scale(0.72) translate(-128, -128)">
    <circle cx="128" cy="128" r="106" fill="none" stroke="url(#c-orb-rim)" stroke-width="2" opacity="0.4" stroke-dasharray="6 6" />
    <circle cx="128" cy="128" r="98" fill="none" stroke="url(#c-orb-rim)" stroke-width="4" filter="url(#c-orb-glow)" opacity="0.85" />
    <circle cx="128" cy="128" r="94" fill="url(#c-orb-sphere)" />
    <circle cx="128" cy="128" r="94" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.4" />

    <g fill="none" stroke="url(#c-orb-orbit)">
      <ellipse cx="128" cy="128" rx="94" ry="40" stroke-width="3" transform="rotate(-25 128 128)" />
      <ellipse cx="128" cy="128" rx="94" ry="40" stroke-width="2.5" transform="rotate(35 128 128)" stroke-dasharray="180 8 40 8" />
      <ellipse cx="128" cy="128" rx="38" ry="94" stroke-width="2.5" transform="rotate(-15 128 128)" />
      <ellipse cx="128" cy="128" rx="94" ry="18" stroke-width="1.5" opacity="0.6" />
    </g>

    <line x1="42" y1="168" x2="214" y2="88" stroke="#80F8FF" stroke-width="1.5" opacity="0.4" stroke-dasharray="3 3" />

    <circle cx="128" cy="128" r="32" fill="url(#c-orb-core)" filter="url(#c-orb-glow)" />
    <circle cx="128" cy="128" r="8" fill="#FFFFFF" />
    <circle cx="128" cy="128" r="14" fill="none" stroke="#80F8FF" stroke-width="2" />

    <circle cx="198" cy="95" r="5" fill="#FFFFFF" filter="url(#c-orb-glow)" />
    <circle cx="198" cy="95" r="8" fill="none" stroke="#00F0FF" stroke-width="1.5" />
    <circle cx="58" cy="160" r="4.5" fill="#80F8FF" />
    <circle cx="112" cy="35" r="3.5" fill="#FFFFFF" />
    <circle cx="168" cy="214" r="3.5" fill="#38BDF8" opacity="0.8" />
  </g>

  <!-- Divider Line -->
  <line x1="205" y1="45" x2="205" y2="155" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Right Typography -->
  <g transform="translate(235, 60)">
    <text x="0" y="52" font-family="'Geist', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" letter-spacing="4" fill="#FFFFFF">ORB</text>
    <text x="148" y="52" font-family="'Geist', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" letter-spacing="4" fill="url(#c-text-cyan)">ORACLE</text>
    <text x="4" y="86" font-family="'Geist Mono', 'Consolas', monospace" font-weight="600" font-size="12.5" letter-spacing="4" fill="#94A3B8">DECENTRALIZED ORACLE NETWORK • STABILITY NEXUS</text>
  </g>
</svg>
